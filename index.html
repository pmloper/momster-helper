<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momster Helper</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<meta name="theme-color" content="#1B2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momster Helper">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F2FF; --card:#FFFFFF; --ink:#1E2A47; --soft:#5B6788; --line:#C9DBF2;
  --gold:#FFC23D; --gold2:#FF9F1C; --done:#E9F9EF; --doneInk:#138A4E;
  --lily:#E2468A; --logan:#1A9C74;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Halloween season tint (October) */
html[data-season="spooky"]{
  --bg:#1A0F26; --card:#241533; --ink:#F5EDFF; --soft:#BBA6D4; --line:#4A2D66;
  --gold:#FFC23D; --gold2:#FF7A1C; --done:#2E1A3F; --doneInk:#9BE38A;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141C30; --card:#1F2A45; --ink:#F0F4FF; --soft:#A9B6D6; --line:#33426A;
  --done:#163A2B; --doneInk:#7BE3A8; --lily:#FF7AB4; --logan:#4CD6A6; } }
:root[data-theme="dark"]{ --bg:#141C30; --card:#1F2A45; --ink:#F0F4FF; --soft:#A9B6D6; --line:#33426A;
  --done:#163A2B; --doneInk:#7BE3A8; --lily:#FF7AB4; --logan:#4CD6A6; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold2);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;padding:12px;max-width:1280px;margin:0 auto}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* Home */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 12px}
.hello h1{font-size:clamp(28px,5vw,48px);line-height:1;margin:0;font-weight:800}
.gear{font-size:28px;width:56px;height:56px;border-radius:50%;background:var(--card);border:2px solid var(--line);flex:none}
.kids{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:86px}
@media (orientation:portrait){.kids{grid-template-columns:1fr}}
.kidBtn{background:var(--card);border-radius:32px;padding:18px;border:4px solid var(--k);min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 0 var(--k);margin-bottom:8px}
.kidBtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--k)}
.kidBtn .av{font-size:clamp(56px,14vh,130px);line-height:1}
.kidBtn .nm{font-size:clamp(34px,7vh,60px);font-weight:800;line-height:1;color:var(--k)}
.bar{height:22px;border-radius:11px;background:var(--line);overflow:hidden;width:100%;max-width:340px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:11px}
.kidBtn .meta{font-size:clamp(18px,3vh,26px);color:var(--soft);font-weight:700}

/* Kid screen */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
.back,.spk{font-size:28px;width:58px;height:58px;border-radius:50%;flex:none}
.back{background:var(--card);border:3px solid var(--line)}
.spk{background:var(--k);color:#fff}
.voiceT{width:100%;display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:22px;padding:10px 14px;background:var(--card);text-align:left;margin-top:4px}
.voiceT.on{border-color:var(--doneInk);background:var(--done)}
.vt-ic{font-size:34px}.vt-tx{flex:1;display:flex;flex-direction:column;line-height:1.15}.vt-tx b{font-size:22px}.vt-tx small{font-size:15px;color:var(--soft);font-weight:700}
.vt-sw{width:58px;height:34px;border-radius:17px;background:var(--line);position:relative;flex:none;transition:background .2s}
.vt-sw i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.voiceT.on .vt-sw{background:var(--doneInk)}.voiceT.on .vt-sw i{left:28px}
.coinBtn{flex:none;height:58px;min-width:58px;border-radius:29px;background:var(--card);border:3px solid var(--gold2);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:22px;font-weight:800}
.bwrap{display:grid;grid-template-columns:minmax(220px,40%) 1fr;gap:16px;min-height:0;flex:1}
@media (orientation:portrait),(max-width:700px){.bwrap{grid-template-columns:1fr}}
.bprev{display:flex;flex-direction:column;align-items:center;gap:6px}
.bprev svg{width:100%;max-width:340px;height:auto;border-radius:28px;background:color-mix(in srgb,var(--k) 10%,var(--card))}
.bcoins{font-size:28px;font-weight:800}
.btabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.btab{font-size:26px;border:3px solid var(--line);border-radius:16px;padding:2px 10px;min-height:52px;background:var(--card)}
.btab.on{border-color:var(--gold2);background:color-mix(in srgb,var(--gold) 20%,var(--card))}
.bopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;overflow:auto;max-height:52vh;padding:2px}
.bopt{border:3px solid var(--line);border-radius:18px;padding:4px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:16px;line-height:1.1;background:var(--card);position:relative}
.bopt svg{width:72px;height:72px}
.bopt .ie{font-size:46px;line-height:1.2}
.bopt.on{border-color:var(--doneInk);background:var(--done)}
.bopt.armed{border-color:var(--gold2);background:color-mix(in srgb,var(--gold) 20%,var(--card))}
.bopt.cant{opacity:.5}
.bparts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;padding-bottom:8px;border-bottom:2px dashed var(--line)}
.bpart{font-size:26px;min-width:52px;min-height:52px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.bpart.on{border-color:var(--gold2);background:color-mix(in srgb,var(--gold) 20%,var(--card))}
@media (max-width:600px){.bpart{font-size:22px;min-width:44px;min-height:44px}}
.bsec{font-size:18px;font-weight:800;color:var(--soft);margin:8px 0 4px;grid-column:1/-1}
.sw{width:58px;height:58px;border-radius:50%;border:4px solid var(--line)}
.sw.on{border-color:var(--ink)}
.who{font-size:clamp(28px,5vw,44px);font-weight:800;color:var(--k);line-height:1;flex:1;min-width:0;white-space:nowrap;display:flex;align-items:center;gap:8px}
.whoAv{display:flex;align-items:center;justify-content:center;flex:none;height:clamp(44px,7vh,54px);width:clamp(44px,7vh,54px);line-height:1}
.whoAv img{display:block;vertical-align:baseline!important;margin:auto}
.whoAv svg,.whoAv span{height:100%!important;width:100%!important;vertical-align:middle}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr clamp(210px,24vw,290px);gap:14px}
.main{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:10px;flex:none}
.tab{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:4px;font-size:clamp(15px,2.4vh,20px);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.05;color:var(--soft);min-height:58px}
.tab b{font-size:clamp(26px,4.2vh,36px);line-height:1}
@media (max-width:900px){.tab{flex-direction:column;gap:0}.tab span{align-items:center}}
.tab span{display:flex;flex-direction:column;align-items:flex-start}
.tab small{font-size:.8em}
.tab.on{border-color:var(--k);color:var(--ink);background:color-mix(in srgb,var(--k) 14%,var(--card))}
.tab.off{opacity:.45}
.tiles{flex:1 0 auto;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,3),1fr);grid-auto-rows:minmax(128px,auto);gap:12px;padding-bottom:6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tile{background:var(--card);border:4px solid var(--line);border-radius:26px;padding:6px;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
  box-shadow:0 5px 0 var(--line)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tile{-webkit-touch-callout:none;touch-action:pan-y}
.tile.pressing{outline:6px solid var(--gold2);outline-offset:-2px;transition:outline-color .7s}
.cancel{display:block;width:100%;margin-top:6px;padding:10px;border-radius:16px;background:var(--bg);font-size:20px;font-weight:800;border:2px solid var(--line)}
.tile .em{font-size:clamp(36px,10vh,84px);line-height:1}
.tile .tx{font-size:clamp(19px,3.2vh,30px);font-weight:700;text-align:center;line-height:1.08}
.tile.done{background:var(--done);border-color:var(--doneInk);box-shadow:0 5px 0 var(--doneInk)}
.tile.done .em{opacity:.3}
.tile.done .tx{color:var(--doneInk)}
.tile.waiting{border-color:var(--gold2);background:color-mix(in srgb,var(--gold) 16%,var(--card))}
.tile.off{opacity:.4}
.tile .wait{font-size:clamp(14px,2.2vh,18px);font-weight:800;color:var(--gold2)}
.tile .x2{background:#3A2F6B!important;color:#FFD84D!important;border:2px solid #FFD84D;position:absolute;top:8px;right:10px;background:var(--gold);color:#1E2A47;border-radius:12px;padding:0 8px;font-size:18px;font-weight:800}
.tile.done::after{content:"⭐";position:absolute;font-size:clamp(44px,11vh,90px);top:50%;left:50%;transform:translate(-50%,-62%);animation:pop .35s ease-out}
@keyframes pop{0%{transform:translate(-50%,-62%) scale(.2)}70%{transform:translate(-50%,-62%) scale(1.25)}100%{transform:translate(-50%,-62%) scale(1)}}
.fullmsg{flex:1;min-height:0;background:var(--card);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-size:clamp(24px,4.5vh,40px);font-weight:800;border:4px dashed var(--gold2);padding:10px;line-height:1.1}
.fullmsg .big{font-size:clamp(60px,16vh,140px);line-height:1}
.fullmsg.rest{border-color:var(--line)}

.jarCard{background:var(--card);border-radius:28px;padding:12px;text-align:center;border:3px solid var(--line);
  display:flex;flex-direction:column;align-items:center;min-height:0;gap:4px}
.jarCard h2{margin:0;font-size:clamp(20px,3.4vh,28px);line-height:1}
.jarCard .left{font-size:clamp(16px,2.6vh,22px);color:var(--soft);font-weight:700;line-height:1.1}
.jar{flex:1;min-height:0;width:100%;display:block}
.prize{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(15px,2.4vh,20px);font-weight:700;border-radius:18px;line-height:1.1;
  padding:6px 10px;background:color-mix(in srgb,var(--gold) 22%,var(--card));width:100%;flex:none}
.prize b{font-size:clamp(28px,5vh,40px)}
.earned{animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.mini{display:none}
/* Portrait / narrow: jar becomes a strip */
@media (orientation:portrait), (max-width:700px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .layout>.main{grid-row:2}
  .layout>.jarCard{grid-row:1;flex-direction:row;padding:8px 12px;gap:10px;text-align:left;align-items:center}
  .jarCard h2,.jarCard .left{display:none}
  .jarCard .jar{width:64px;height:auto;flex:none}
  .jarCard .jar text{font-size:13px}
  .mini{display:flex;flex:1;flex-direction:column;gap:4px;font-size:20px;font-weight:800;min-width:0}
  .prize{width:auto;max-width:48%}
  .jarCard .shopBtn{display:flex;flex:none;padding:6px 10px;font-size:13px;min-width:0;white-space:nowrap}
  .jarCard .shopBtn b{font-size:18px}
  .jarCard .prize{flex:0 1 auto;min-width:120px}
  .jarCard .mini{flex:1 1 100%}
  .jarCard .mini .bar{height:10px}
  .jarCard .prize{flex:1 1 auto;max-width:none;line-height:1.15;display:flex;align-items:center;gap:4px}
  .jarCard .prize b{margin-right:4px}
  .jarCard{flex-wrap:wrap}
  .jarCard .mini{order:-1}
  .jarCard .shopBtn{order:1}
  .jarCard .prize:not(.shopBtn){order:2}
}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(10,16,32,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.sheet{background:var(--card);border-radius:30px;padding:18px;max-width:900px;width:100%;max-height:96%;overflow:auto;display:flex;flex-direction:column}
.sheet h2{margin:0 0 2px;font-size:clamp(19px,3.4vh,30px);line-height:1.1}
.sheet p{margin:0 0 10px;color:var(--soft);font-size:18px}
.rewards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (orientation:portrait), (max-width:700px){.rewards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rw{border:3px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:22px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:clamp(14px,2.3vh,19px);font-weight:700;line-height:1.05;text-align:center}
.rw b{font-size:clamp(34px,7vh,56px);line-height:1.1}
.rw.on{border-color:var(--gold2);background:color-mix(in srgb,var(--gold) 20%,var(--card))}
.party{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.party span{position:absolute;top:-60px;font-size:44px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.cheer{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:31;background:var(--card);border-radius:36px;
  padding:20px 30px;text-align:center;font-size:clamp(28px,6vw,46px);font-weight:800;border:6px solid var(--gold2);animation:pop2 .4s ease-out;line-height:1.1}
.cheer .big{font-size:84px;line-height:1}
.cheer.tapcard{cursor:pointer;z-index:32}.cheer .tapnote{margin-top:10px;font-size:16px;font-weight:700;color:var(--soft);animation:tapblink 1.4s ease-in-out infinite}
@keyframes tapblink{50%{opacity:.35}}
@keyframes pop2{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}

/* Grown-up */
.pin{display:grid;grid-template-columns:repeat(3,68px);gap:8px;justify-content:center;margin:8px 0}
.pin button{height:62px;border-radius:18px;background:var(--bg);font-size:28px;font-weight:800}
.dots{text-align:center;font-size:32px;letter-spacing:10px;min-height:40px}
.gbar{flex:none;background:var(--ink);color:var(--card);border-radius:16px;padding:6px 12px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.gbar span{flex:1}
.gbar button{background:var(--gold);color:#1E2A47;border-radius:12px;padding:2px 14px}
.pk{border:2px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:10px}
.pk h3{margin:0 0 4px;font-size:22px;color:var(--k)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:17px;margin:5px 0}
.chip{background:var(--bg);border-radius:14px;padding:6px 12px;font-weight:700;font-size:18px;border:2px solid var(--line);min-height:48px;min-width:52px}
.chip.big{font-size:22px;padding:6px 18px;min-width:72px}
.chip.go{background:var(--gold);color:#1E2A47;border-color:var(--gold2)}
.tips{font-size:17px;line-height:1.4;padding-left:22px;margin:6px 0}
.tips li{margin-bottom:6px}
details summary{font-size:20px;font-weight:800;cursor:pointer;margin:6px 0}
.note{font-size:15px;color:var(--soft)}
.flame{font-size:.45em;font-weight:800;color:var(--gold2);vertical-align:super;margin-left:2px}
.race{flex:none;margin-bottom:10px;background:var(--card);border:3px solid var(--gold2);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:clamp(16px,2.6vh,22px);font-weight:800}
.race .track{flex:1;height:20px;border-radius:10px;background:var(--line);overflow:hidden}
.race .track i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#FF5A5A,var(--gold2),var(--gold));transition:width 1s linear}
.race.won{border-color:var(--doneInk);color:var(--doneInk)}
.team{flex:none;display:flex;align-items:center;gap:10px;background:var(--card);border:3px dashed var(--gold2);border-radius:22px;padding:8px 14px;margin:0 0 12px;font-size:clamp(17px,2.8vh,24px);font-weight:800}
.team b{font-size:1.6em;line-height:1}
.team .ok{margin-left:auto;white-space:nowrap}
.in{font:inherit;font-size:18px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px;user-select:text;-webkit-user-select:text}
.in.em{width:64px;text-align:center;font-size:24px}
.in.tx{flex:1;min-width:160px}

.tab em{font-style:normal}.tab .sm{display:none}
@media (max-width:1300px){.tab .lg{display:none}.tab .sm{display:inline}}
.monster{flex:none;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid #E5484D;border-radius:22px;padding:6px 14px;margin:0 0 12px;font-weight:800}
.monster.dead{border-color:var(--doneInk)}
.mface{font-size:40px;line-height:1;position:relative}.mface i{position:absolute;right:-10px;bottom:-4px;font-size:22px;font-style:normal}
.minfo{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;font-size:clamp(15px,2.6vh,20px)}
.mbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#E5484D,#FF8A5B);transition:width .6s}
.mhp{white-space:nowrap;font-size:18px}
.pow{position:fixed;right:18px;top:80px;z-index:32;font-size:46px;font-weight:800;animation:pow .9s ease-out forwards;pointer-events:none}
@keyframes pow{0%{transform:scale(.3) rotate(-20deg);opacity:0}30%{transform:scale(1.3) rotate(8deg);opacity:1}100%{transform:translateY(-40px) scale(1);opacity:0}}
.tile .twist{position:absolute;left:5%;top:4px;right:5%;background:color-mix(in srgb,var(--gold) 24%,var(--card));color:var(--ink);border:1.5px solid color-mix(in srgb,var(--gold2) 55%,transparent);border-radius:10px;padding:3px 10px 4px;font-size:clamp(14px,9.5cqw,24px);font-weight:800;line-height:1.15;white-space:normal;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}


.egg{cursor:pointer;line-height:1.1;display:inline-block;position:relative;transition:font-size .2s}
.egg.shake{animation:shake .4s}
.egg .crack{position:absolute;font-size:.35em;left:50%;top:40%;transform:translate(-50%,-50%)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.eggBtn{background:color-mix(in srgb,#9B5DE5 25%,var(--card))!important;animation:wiggle 1s infinite}
.handsfull{border:4px solid #e5484d;background:color-mix(in srgb,#e5484d 12%,var(--card))}.handsfull h2{color:#c0272d}
.bopt .tag{position:absolute;top:2px;right:4px;font-size:14px}
[data-say]{cursor:pointer}
.stk{border:3px dashed var(--line);border-radius:18px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:800;color:var(--soft);text-align:center;line-height:1.1}
.stk span{font-size:38px;line-height:1.2;filter:grayscale(1) contrast(.6);opacity:.35}
.stk.got{border-style:solid;color:var(--ink);border-color:var(--gold2);background:color-mix(in srgb,var(--gold) 15%,var(--card))}.stk.got span{filter:none;opacity:1}
.disco{flex-direction:column;background:#140A2A;animation:disco 2.4s infinite linear}

/* ================= Modern refresh ================= */
:root{--bg:#EEF3FF;--card:#FFFFFF;--ink:#1B2140;--soft:#667094;--line:#E1E7F5;--brand:#7C5CFF;--brand2:#FF5DA2;
  --shadow:0 1px 2px rgba(20,30,70,.06),0 10px 28px rgba(20,30,70,.08);--r:24px;
  --font:"Nunito",ui-rounded,system-ui,sans-serif;--disp:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1326;--card:#1A2142;--ink:#EEF2FF;--soft:#9AA6CC;--line:#2A3560;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}

body{font-family:var(--font);font-weight:800}
h1,h2,h3,.nm,.who,.tile .tx,.tab,.bigbtn b,.dlabel,.cheer,.bcoins,.prize,.kchips span,.mhp,.minfo b,.fullmsg,.jarCard h2,.hero b,.grp-t,.rw,.stk{font-family:var(--disp);font-weight:600}
h1,h2{letter-spacing:-.3px}
/* cards */
.kidBtn,.jarCard,.team,.monster,.race,.fullmsg,.sheet,.tab,.rw,.bopt,.stk,.wvrow{box-shadow:var(--shadow)}
.kidBtn{border-width:3px;border-radius:32px;box-shadow:0 6px 0 var(--k),var(--shadow)}
.tile{border-width:2px;border-radius:26px;box-shadow:0 5px 0 color-mix(in srgb,var(--rc) 40%,var(--line)),var(--shadow)}
.tile.done{border-color:var(--doneInk);box-shadow:0 5px 0 var(--doneInk),var(--shadow)}
.tab{border-width:2px;border-radius:20px}
.jarCard,.team,.monster,.race{border-width:2px}
.team{border-style:solid;border-color:color-mix(in srgb,var(--gold2) 60%,var(--line))}
.sheet{border-radius:28px;border:1px solid var(--line)}
.ov{background:rgba(8,12,30,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.back,.gear{background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow)}
/* buttons */
.chip{border:none;background:color-mix(in srgb,var(--ink) 7%,var(--card));border-radius:999px;font-weight:800}
.chip.go{background:linear-gradient(180deg,#FFD866,#FFB800);color:#3B2A00}
.btn{font:inherit;font-family:var(--font);font-weight:900;border-radius:999px;padding:10px 18px;min-height:44px;background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 40%,transparent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:6px 14px;min-height:38px;font-size:15px}
.in{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font-family:var(--font);font-weight:800}
.in.tm{width:118px}
/* settings sheet */
.gsheet{background:var(--bg);max-width:640px;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ghead{background:var(--bg);top:-16px;padding:6px 0 8px}

/* ---- Readability pass ---- */
body{background-image:radial-gradient(color-mix(in srgb,var(--gold) 18%,transparent) 1.4px,transparent 2px),radial-gradient(color-mix(in srgb,var(--lily) 12%,transparent) 1.4px,transparent 2px)}

  .kids.multi .kidBtn .nm{font-size:22px}.kids.multi .kchips span{font-size:12px;padding:0 6px}
  .boss{padding:6px 10px;margin-bottom:8px}.boss .mood{display:none}
}
@media (max-height:520px){.hello{margin-bottom:6px}.hello h1{font-size:22px;white-space:normal;line-height:1.15;overflow:visible;text-overflow:clip}.gear{width:42px!important;height:42px!important;font-size:20px!important}.kids:not(.multi) .kidBtn>.av{font-size:min(22vh,16vw)!important}}
.kids.many{overflow-y:auto!important;overflow-x:hidden;grid-auto-rows:calc((100% - (var(--pg-rows) - 1)*16px)/var(--pg-rows))!important;align-content:start}
.hello .gear{margin-left:6px}.hello h1{flex:1;min-width:0}
@media (max-width:600px){.hello .gear{width:44px;height:44px;font-size:22px;margin-left:2px}}
.tile .badges{position:absolute;top:6px;right:6px;left:6px;display:flex;justify-content:flex-end;gap:4px;z-index:2;pointer-events:none}
.tile .badges .x2,.tile .badges .wk{position:static!important;font-size:clamp(12px,8cqh,17px)!important;line-height:1.35;padding:0 8px;border-radius:999px;white-space:nowrap}
.tile .badges .x2{border-width:1.5px!important}
.tile .badges .wk{border-width:2px!important;background:#1E2A47!important;color:#fff!important;border-color:#FFD84D!important}
.tile.hasB{padding-top:clamp(14px,9cqh,26px)}
.tile.hasB .em{font-size:min(38cqh,44cqw)}
.tile.waiting .em,.tile.hasTw .em{font-size:min(28cqh,36cqw)}
.tile .wait{line-height:1.1}
.tile .twist{white-space:normal;text-align:left;line-height:1.15;padding:2px 8px;font-size:clamp(15px,10cqw,26px)}.tile.hasX2 .twist{right:48px} .tile.hasTw{padding-top:clamp(22px,13cqw,38px)}
.tile .tx{width:100%;overflow-wrap:normal;word-break:normal;hyphens:none}
/* Kid jobs stack icon, full label and reward stars, including on small phones. */
.tiles>.tile{container-type:inline-size;overflow:visible;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 8px}
.tiles>.tile .em{order:1;flex:none;font-size:min(8vh,46cqw)}
.tiles>.tile .tx{order:2;flex:none;display:block;overflow:visible;-webkit-line-clamp:unset;font-size:clamp(15px,min(3vh,9cqw),25px)}
.tiles>.tile .stars{order:3;display:block;flex:none;font-size:18px;line-height:1.1;white-space:nowrap}
.tiles>.tile .badges{position:static;order:4;justify-content:center;flex-wrap:wrap}
.tiles>.tile .wait{order:5}
.tiles>.tile.hasB{padding-top:10px}
.tiles>.tile.hasB .em{font-size:min(7vh,44cqw)}
.tiles>.tile.waiting .em,.tiles>.tile.hasTw .em{font-size:min(6vh,36cqw)}
.tiles>.tile.hasTw{padding-top:clamp(22px,13cqw,38px)}
.tiles>.tile.done::after{content:none}
@media (max-width:600px),(max-height:520px){
  .tiles>.tile.bonus{display:flex!important;text-align:center;padding:10px 8px!important}
  .tiles>.tile.bonus .em{font-size:min(8vh,46cqw)!important}
  .tiles>.tile.bonus .tx{text-align:center;font-size:clamp(15px,min(3vh,9cqw),25px)!important}
  .tiles>.tile.bonus .badges{position:static;order:3;justify-content:center}
  .tiles>.tile.bonus .wait{font-size:13px}
}
.stlsheet{max-width:720px;text-align:center}
.stlsheet .styles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.stl{padding:6px 4px 8px!important;font-size:inherit!important;gap:2px}
.stl-pic{width:100%;aspect-ratio:1;display:block;border-radius:16px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.stl-n{font-family:var(--disp);font-weight:600;font-size:clamp(13px,2.2vw,19px);line-height:1.15;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:break-word}
.stl small{font-size:12px!important}
@media (max-width:420px){.coinBtn svg{display:none}.coinBtn{padding:0 12px}.who .wn small{font-size:14px;margin-bottom:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:600px){ .bar-card .who .wn small{display:none} }
@media (max-width:600px){.stlsheet .styles{grid-template-columns:repeat(3,minmax(0,1fr))}.stl-n{font-size:14px}.stl small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---- Setup wizard ---- */
.wizgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,44vw),1fr));gap:6px}
.wizjob{position:relative;display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--bg);text-align:left;min-height:52px}
.wizjob.on{border-color:var(--doneInk);background:var(--done)}
.wizjob .wj-e{font-size:24px;flex:none}
.wizjob .wj-t{font-size:14px;font-weight:800;line-height:1.15;color:var(--ink)}
.wizjob .wj-check{position:absolute;right:8px;top:6px;font-weight:900;color:var(--doneInk)}
@media (max-width:600px){.wizgrid{grid-template-columns:1fr 1fr}}

/* ---- Test mode ---- */
#tmBanner{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:8px;
  background:linear-gradient(90deg,#7C5CFF,#FF5DA2);color:#fff;padding:6px 10px;font-weight:800;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tmBanner b{font-family:var(--disp);letter-spacing:.5px;white-space:nowrap;font-size:13px}
#tmBanner span{flex:1;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tmBanner button{background:#fff;color:#1B2140;border-radius:999px;padding:5px 12px;font-weight:900;font-size:12px;white-space:nowrap;flex:none}
#tmBanner button:active{transform:translateY(1px)}
body.tm{padding-top:40px}
.wizfoot{display:flex;align-items:center;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.wizfoot small{opacity:.7}
.wizfoot small{color:var(--soft);font-weight:700;font-size:13px}

/* ---- Ride chip ---- */
.hello .homeSpk{width:48px;height:48px;font-size:24px;margin-left:6px;background:color-mix(in srgb,var(--gold) 18%,var(--card));border:2px solid var(--gold2);color:inherit;box-shadow:none}
@media (max-width:600px){.hello .homeSpk{width:42px;height:42px;font-size:20px}}
.kidBtn{position:relative}
.kidTime{position:absolute;top:10px;right:12px;z-index:3;font-size:clamp(14px,2.4vh,19px);font-weight:800;line-height:1.2;padding:4px 12px;min-height:34px;display:inline-flex;align-items:center;border-radius:999px;
  background:color-mix(in srgb,var(--gold) 18%,var(--card));border:2px solid var(--gold2);white-space:nowrap;cursor:pointer}
@media (max-width:600px){.kidTime{font-size:15px;padding:3px 10px;top:8px;right:10px}}

/* ---- Per-kid leave-by rows ---- */
.kt{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ktk{border-left:4px solid var(--kc);padding:2px 0 2px 8px}
.kth{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.ktg{display:flex;flex-direction:column;gap:6px}
.ktg .fld{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.ktg .fld .in.tm{width:150px;flex:none}
</style>

/* PIN: kept as a salted SHA-256 hash (settings.pinHash + settings.pinSalt) so it is never saved or synced as plain text.
   An older plain-text settings.pin still works until upgradePin() converts it. */
const sha256hex = (() => {
  const K=[], H0=[]; const isPrime=x=>{ for(let i=2;i*i<=x;i++) if(x%i===0) return false; return true; };
  for(let n=2,c=0;c<64;n++){ if(!isPrime(n)) continue; if(c<8) H0[c]=(Math.sqrt(n)%1)*4294967296|0; K[c]=(Math.cbrt(n)%1)*4294967296|0; c++; }
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  return str => { const b=new TextEncoder().encode(str), l=b.length, nb=((l+9+63)>>6)<<6, m=new Uint8Array(nb); m.set(b); m[l]=0x80;
    const dv=new DataView(m.buffer); dv.setUint32(nb-4,(l*8)>>>0); dv.setUint32(nb-8,Math.floor(l*8/4294967296));
    const h=H0.slice(), w=new Int32Array(64);
    for(let o=0;o<nb;o+=64){ for(let i=0;i<16;i++) w[i]=dv.getInt32(o+4*i);
      for(let i=16;i<64;i++){ const a=w[i-15], c=w[i-2], s0=rotr(a,7)^rotr(a,18)^(a>>>3), s1=rotr(c,17)^rotr(c,19)^(c>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
      let [a,b2,c2,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){ const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), t1=(hh+S1+ch+K[i]+w[i])|0, S0=rotr(a,2)^rotr(a,13)^rotr(a,22), mj=(a&b2)^(a&c2)^(b2&c2), t2=(S0+mj)|0;
        hh=g; g=f; f=e; e=(d+t1)|0; d=c2; c2=b2; b2=a; a=(t1+t2)|0; }
      h[0]=(h[0]+a)|0; h[1]=(h[1]+b2)|0; h[2]=(h[2]+c2)|0; h[3]=(h[3]+d)|0; h[4]=(h[4]+e)|0; h[5]=(h[5]+f)|0; h[6]=(h[6]+g)|0; h[7]=(h[7]+hh)|0; }
    return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join(""); };
})();
function setPin(pin){ const r=new Uint8Array(8); crypto.getRandomValues(r); settings.pinSalt=[...r].map(x=>x.toString(16).padStart(2,"0")).join(""); settings.pinHash=sha256hex(settings.pinSalt+pin); delete settings.pin; }
function pinMatches(input){ return settings.pinHash ? sha256hex((settings.pinSalt||"")+input)===settings.pinHash : input===(settings.pin||DEFAULT_PIN); }
function upgradePin(){ if(settings.pinHash) return false; setPin(settings.pin||DEFAULT_PIN); return true; }

function toUrl(b64){ try{ const bin=atob(b64), arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);

const NAME_PARTS = { hi:["nlead_hi"], justme:["nlead_justme"], blame:["nlead_blame"],

  const keys=[p[0], "nm_"+sl].concat(p[1]?[p[1]]:[]);

function voiceFile(k){ const cv=curVoice(), dirs=cv===DEFAULT_VOICE_DIR ? [DEFAULT_VOICE_DIR] : [cv,DEFAULT_VOICE_DIR];
  for(const d of dirs){ if(AUDIO_INDEX[d] && AUDIO_INDEX[d].has(k)) return AUDIO_DIR+d+"/"+encodeURIComponent(k)+".mp3"; } return null; }

function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  const pref=[/Samantha/i,/Ava/i,/Allison/i,/Siri/i,/Google US English/i,/Jenny/i,/Aria/i,/Zira/i];
  for(const re of pref){ const v=vs.find(v=>re.test(v.name)&&/^en/i.test(v.lang)); if(v) return v; }
  return vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){ return null; } }

function speakName(text, done){

    let fin=false; const f=()=>{ if(!fin){ fin=true; done(); } };

    speechSynthesis.speak(u); }catch(e){ done(); } }
const MOMSTER_CLIPS = Store.get("momster_voice") || {}; // recorded mom voice lives here when added
function nextClip(){
  const k=queue.shift(); if(!k) return;
  // Kid-name sentence: generated clip, else the device voice reads the whole sentence.
  if(k.startsWith("N:")){ const i=k.indexOf(":",2), t=k.slice(2,i), n=k.slice(i+1), parts=nameParts(t,n);
    if(parts){ queue.unshift(...parts); return nextClip(); }
    return enVoices().length ? speakName(nameLineText(t,n), nextClip) : nextClip(); }
  if(k.startsWith("NP:")){ const f=voiceFile(k.slice(3)); return f ? playUrl(f,k) : nextClip(); }
  // Any other written line plays its generated clip, or nothing if the clip does not exist yet.
  if(k.startsWith("BJ:")){ const f=voiceFile(textKey(k.slice(3))); return f ? playUrl(f,k) : nextClip(); }
  if(k.startsWith("V:")){ const i=k.indexOf(":",2), f=villainFile(k.slice(2,i), textKey(k.slice(i+1))); return f ? playUrl(f,k) : nextClip(); }
  if(k.startsWith("momster_")){ const u=MOMSTER_CLIPS[k]||voiceFile(k); return u ? playUrl(u) : nextClip(); }

  const u=clipUrl(k); if(u) return playUrl(u,k);

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function weekStart(d=new Date()){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return ymd(x); }
const todayDow = () => new Date().getDay();
const activeFor = (item,dow) => !item.days || item.days.includes(dow);
function weekParity(wk){ return Math.floor(new Date((wk||WEEK)+"T12:00:00").getTime()/(7*864e5))%2; }
/* A job's `who` is empty (everyone), one kid id (older saves), or a list of kid ids. */
const whoList = j => { const w=j&&j.who; return Array.isArray(w) ? w.filter(Boolean) : (w ? [w] : []); };
const jobIsFor = (j, kid) => { const w=whoList(j); return !w.length || w.includes(kid); };
const normWho = ids => ids.length===0 ? "" : ids.length===1 ? ids[0] : ids.slice();
function toggleWho(ids, kidId){ return ids.includes(kidId) ? ids.filter(x=>x!==kidId) : ids.concat(kidId); }
function jobsFor(r,dow,kid,wk){ kid=kid||view.kid||FIRST_KID;
  if(r.helper){ const n=HELPER_LIST.length; if(!n) return []; const wn=Math.floor(new Date((wk||WEEK)+"T12:00:00").getTime()/(7*864e5));
    return [HELPER_LIST[(dow + kidIndex(kid) + wn) % n]]; }
  return activeFor(r,dow) ? r.jobs.filter(j=>jobIsFor(j,kid)&&activeFor(j,dow)) : []; }
const pts = id => String(id).startsWith("h_") ? 2 : 1;
function possibleThisWeek(){ let n=0; for(const kid of KID_IDS){ let m=0; for(let d=0; d<7; d++){ ROUTINES.forEach(r=>{ const js=jobsFor(r,d,kid); js.forEach(j=>m+=pts(j.id)); if(js.length) m+=1; }); if(pickList().length) m+=2; } if(m>n) n=m; } return n; }
function teamPossible(){ let n=0; for(const kid of KID_IDS){ for(let d=0; d<7; d++){ ROUTINES.forEach(r=>{ const js=jobsFor(r,d,kid); js.forEach(j=>n+=pts(j.id)); if(js.length) n+=1; }); if(pickList().length) n+=2; } } return n; }
const POOL_FRAC = 0.8; // a week of ~80% effort busts the Momster
function defaultRoutine(){ const h=new Date().getHours(), dow=todayDow();
  if(h<11) return "am"; if(h<17 && activeFor(ROUTINES[1],dow)) return "pm"; return "bt"; }

let settings = loadLocal("settings") || {pin:DEFAULT_PIN, goal:DEFAULT_GOAL, avatars:{}};
const bonusJobs = () => (settings.bonusJobs && settings.bonusJobs.length) ? settings.bonusJobs : DEFAULT_BONUS;
let weeks = {};
Object.keys(KIDS).forEach(k=>weeks[k] = Object.assign(blankWeek(), loadLocal("w_"+WEEK+"_"+k) || {}));
function blankWeek(){ return {done:{}, bonus:0, reward:null, reward2:null, rewardGiven:false, extra:{}, race:{}}; }
function normWeek(d){ d=d||{}; return {done:JSON.parse(JSON.stringify(d.done||{})), bonus:d.bonus||0, reward:d.reward||null, reward2:d.reward2||null, rewardGiven:!!d.rewardGiven,
  extra:JSON.parse(JSON.stringify(d.extra||{})), race:Object.assign({},d.race||{})}; }
let prevWeeks = {}, team = {given:false};
const prevWeekKey = () => { const d=new Date(WEEK+"T12:00:00"); d.setDate(d.getDate()-7); return ymd(d); };
Object.keys(KIDS).forEach(k=>prevWeeks[k]=normWeek(loadLocal("w_"+prevWeekKey()+"_"+k)));
function loadLocal(key){ return Store.get("starjobs_"+key); }
function saveLocal(key,val){ Store.set("starjobs_"+key, val); }

let db = null, unsubs = [];
try{ Store.keys(/^starjobs_w_\d{4}-\d\d-\d\d_\w+$/).forEach(key=>{ const w=Store.get(key); if(w) allWeeks[key.slice("starjobs_w_".length)]=w; }); }catch(e){}
const pending = {}, writing = {};
async function writeDoc(path, data){
  pending[path] = data; if(writing[path]) return; writing[path] = true;
  while(pending[path]){ const d = pending[path]; pending[path] = null;
    try{ await db.doc(path).set(d); if(!pending[path]) clearDirty(path); }catch(e){ console.warn("save failed", e); } }
  writing[path] = false;
}
// If stars get taken back (undo, clear week) after coins were spent, forgive the gap
// so a kid never has hidden "coin debt" that eats their next stars.
function settleCoins(k){ const b=buddies[k]; if(!b) return; const max=earnedCoins(k);
  if((b.spent||0)>max){ b.spent=max; saveBuddy(k); } }
function saveWeek(kid){ reconcileCoins(kid); settleCoins(kid); saveLocal("w_"+WEEK+"_"+kid, weeks[kid]); cloudWrite("weeks/"+WEEK+"_"+kid, weeks[kid]); }
function saveSettings(){ saveLocal("settings", settings); cloudWrite("settings/main", settings); }
function subscribe(){
  unsubs.forEach(u=>u()); unsubs=[];
  if(!db) return;
  Object.keys(KIDS).forEach(k=>{
    unsubs.push(db.doc("weeks/"+WEEK+"_"+k).onSnapshot(s=>{
      if(s.exists){ weeks[k] = normWeek(s.data()); saveLocal("w_"+WEEK+"_"+k, weeks[k]); render(); if(document.getElementById("wvSheet")) weekView(); }
    }, e=>console.warn(e)));
    db.doc("weeks/"+prevWeekKey()+"_"+k).get().then(s=>{ if(s.exists){ prevWeeks[k]=normWeek(s.data()); saveLocal("w_"+prevWeekKey()+"_"+k, prevWeeks[k]); render(); } }).catch(()=>{});
  });
  unsubs.push(db.collection("weeks").onSnapshot(qs=>{ const m={}; qs.docs.forEach(d=>{ m[d.id]=normWeek(d.data()); }); allWeeks=m; render(); }, e=>console.warn(e)));
  Object.keys(KIDS).forEach(k=>unsubs.push(db.doc("buddies/"+k).onSnapshot(s=>{ if(s.exists){ const d=s.data();
    buddies[k]=Object.assign(BLANK_BUDDY(), JSON.parse(JSON.stringify(d)), {look:Object.assign({},DEFAULT_LOOK,d.look||{}), owned:Array.isArray(d.owned)?d.owned.slice():["balloon"], wear:normalizeWear(Object.assign({},d.wear||{}))});
    saveLocal("buddy_"+k,buddies[k]); render(); if(document.getElementById("buddySheet")) buddySheet(k===view.kid?k:view.kid); } }, e=>console.warn(e))));
  unsubs.push(db.doc("family/main").onSnapshot(s=>{ if(testMode || !s.exists) return; const d=s.data();
    if(canon(d)!==canon(FAMILY_SET?FAMILY:null)) cloudAdoptFamily(d); }, e=>console.warn(e)));
  unsubs.push(db.doc("teams/"+WEEK).onSnapshot(s=>{ team = s.exists ? {given:!!s.data().given} : {given:false}; render(); }, e=>console.warn(e)));
  unsubs.push(db.doc("settings/main").onSnapshot(s=>{
    if(s.exists){ const d=s.data(); settings = {pin:d.pinHash?undefined:(d.pin||DEFAULT_PIN), pinHash:d.pinHash||undefined, pinSalt:d.pinSalt||undefined, goal:d.goal||DEFAULT_GOAL, voice:MOMSTER_VOICES.includes(d.voice)?d.voice:"momster", bonusJobs:Array.isArray(d.bonusJobs)?JSON.parse(JSON.stringify(d.bonusJobs)):null, launched:d.launched||null, raceEnd:d.raceEnd||null, driveEnd:d.driveEnd||null, driveDate:d.driveDate||null, walkEnd:d.walkEnd||null, busEnd:d.busEnd||null, kidEnds:d.kidEnds&&typeof d.kidEnds==='object'?JSON.parse(JSON.stringify(d.kidEnds)):null, raceOff:d.raceOff===true, rideMode:d.rideMode||null, rideDate:d.rideDate||null, teamPrize:d.teamPrize?Object.assign({},d.teamPrize):null, avatars:Object.assign({},d.avatars||{}), heroStyle:Object.assign({},d.heroStyle||{}), event:d.event?Object.assign({},d.event):null, toots:d.toots===false?false:true, setupDone:!!d.setupDone}; if(!settings.pinHash){ upgradePin(); writeDoc("settings/main", JSON.parse(JSON.stringify(settings))); } saveLocal("settings",settings); render(); }
  }, e=>console.warn(e)));
  subscribeVoices();
}
function b64ToUrl(b64,mime){ const bin=atob(b64), arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return URL.createObjectURL(new Blob([arr],{type:mime||"audio/mp4"})); }
function setVoice(key, rec){ if(VOICE[key]) URL.revokeObjectURL(VOICE[key]); if(rec&&rec.b64) VOICE[key]=b64ToUrl(rec.b64,rec.mime); else delete VOICE[key]; }
(function loadLocalVoices(){ PHRASES.forEach(([k])=>{ const r=loadLocal("v_"+k); if(r) setVoice(k,r); }); })();
async function saveVoice(key, rec){ setVoice(key, rec);
  if(rec) Store.set("starjobs_v_"+key, rec); else Store.remove("starjobs_v_"+key);
  if(db){ try{ rec ? await db.doc("voices/"+key).set(rec) : await db.doc("voices/"+key).delete(); }catch(e){ toast("Couldn't save that clip online. It's saved on this device only."); } } }
function subscribeVoices(){ if(!db) return;
  unsubs.push(db.collection("voices").onSnapshot(qs=>{ const seen=new Set();
    qs.docs.forEach(d=>{ seen.add(d.id); const r=d.data(); const cur=loadLocal("v_"+d.id);
      if(!cur || cur.b64!==r.b64 || !VOICE[d.id]){ setVoice(d.id,r); Store.set("starjobs_v_"+d.id, {mime:r.mime,b64:r.b64}); } });
    if(document.getElementById("recList")) recSheet(); }, e=>console.warn(e))); }
/* ---------- Cloud sync (Convex) ----------
   Optional: with no login the app works exactly as before, on this device only. Signing in attaches a Firestore-style
   `db` (cloud-db.js) and the existing writeDoc/subscribe code does the rest. */
const canon = x => JSON.stringify(x, (k, v) => (v && typeof v==="object" && !Array.isArray(v)) ? Object.keys(v).sort().reduce((o,kk)=>{ o[kk]=v[kk]; return o; }, {}) : v);
const CLOUD_LINKED = "momster_cloud_linked", DIRTY_KEY = "momster_dirty";
/* Offline safety: a save made while not connected is remembered as "dirty" and uploaded before any cloud copy is
   applied, so reconnecting never replaces newer work done on this device. */
const dirtySet = () => Store.get(DIRTY_KEY) || {};
function markDirty(path){ const d=dirtySet(); if(d[path]) return; d[path]=1; Store.set(DIRTY_KEY, d); }
function clearDirty(path){ const d=dirtySet(); if(!d[path]) return; delete d[path]; Store.set(DIRTY_KEY, d); }
function cloudWrite(path, data){ if(testMode) return; if(Store.rawGet(CLOUD_LINKED)) markDirty(path); if(db) writeDoc(path, JSON.parse(JSON.stringify(data))); }
function localDocFor(path){ const col=path.split("/")[0], id=path.slice(path.indexOf("/")+1);
  if(col==="weeks") return Store.get("starjobs_w_"+id); if(col==="buddies") return Store.get("starjobs_buddy_"+id);
  if(col==="settings") return settings; if(col==="family") return FAMILY_SET ? FAMILY : null; return null; }
async function flushDirty(d){ for(const path of Object.keys(dirtySet())){ const doc=localDocFor(path); if(!doc){ clearDirty(path); continue; }
  await d.doc(path).set(JSON.parse(JSON.stringify(doc))); clearDirty(path); } }
function cloudLocalDocs(){
  const out=[]; if(FAMILY_SET) out.push({path:"family/main", data:FAMILY});
  out.push({path:"settings/main", data:settings});
  Store.keys(/^starjobs_w_\d{4}-\d\d-\d\d_\w+$/).forEach(key=>{ const w=Store.get(key); if(w) out.push({path:"weeks/"+key.slice("starjobs_w_".length), data:w}); });
  Object.keys(KIDS).forEach(k=>{ if(buddies[k]) out.push({path:"buddies/"+k, data:buddies[k]}); });
  return out; }
function cloudBackup(){ if(Store.rawGet("momster_backup_before_sync")) return;
  const snap={}; Store.keys(/^starjobs_(?!v_)/).forEach(k=>{ snap[k]=Store.rawGet(k); }); Store.rawSet("momster_backup_before_sync", JSON.stringify(snap)); }
function cloudAdoptFamily(d){
  // Another device (or the cloud copy) has this family's kids and jobs: take them and rebuild the app once.
  let n=0; try{ n=Number(sessionStorage.getItem("momster_adopt_n")||0); sessionStorage.setItem("momster_adopt_n", String(n+1)); }catch(e){}
  if(n>=2) return;                                  // never loop
  cloudBackup(); Store.set("starjobs_family", d); location.reload(); }
let cloudBusy=false;
function cloudAttach(){
  const C=window.MomsterCloud; if(!C || !C.configured || !C.signedIn || db || cloudBusy) return; cloudBusy=true;
  const d=C.openDb();
  d.whenLoaded().then(async ()=>{
    if(upgradePin()) saveSettings();
    const remote=d.paths().includes("family/main"), first=!Store.rawGet(CLOUD_LINKED);
    if(remote){ if(first) cloudBackup(); }
    else if(FAMILY_SET){ try{ await d.bulkSet(cloudLocalDocs()); toast("Synced! Your stars are saved online."); }catch(e){ console.warn("first sync failed", e); cloudBusy=false; toast("Couldn't sync yet. Try again in a moment."); return; } }
    Store.rawSet(CLOUD_LINKED,"1");
    try{ await flushDirty(d); }catch(e){ console.warn("could not upload offline changes yet", e); cloudBusy=false; setTimeout(cloudAttach, 15000); return; }
    db=d; cloudBusy=false; subscribe(); render(); if(document.getElementById("gPanel")) panel();
  });
}
function cloudDetach(){ unsubs.forEach(u=>{ try{ u(); }catch(e){} }); unsubs=[]; db=null; cloudBusy=false; try{ window.MomsterCloud.closeDb(); }catch(e){} }
function cloudInit(){
  const C=window.MomsterCloud; if(!C || !C.configured) return;
  C.onAuthChange(ok=>{ if(ok) cloudAttach(); else { cloudDetach(); render(); } });
  C.resume().then(ok=>{ if(ok) cloudAttach(); }).catch(()=>{});
}
window.addEventListener("momster-cloud-ready", cloudInit);
window.addEventListener("online", () => { const C=window.MomsterCloud; if(!C || !C.configured) return; if(C.signedIn) cloudAttach(); else if(C.hasStoredLogin()) C.resume().catch(()=>{}); });
const cloudOn = () => !!(window.MomsterCloud && window.MomsterCloud.configured);
function cloudRow(){
  if(!cloudOn()) return "";
  const C=window.MomsterCloud;
  return C.signedIn
    ? `<div class="srow"><span class="sl">☁️ Synced across devices<small>Signed in as ${esc(C.email||"your email")}${db?"":" · connecting…"}</small></span><button class="btn ghost sm" data-a="cloudOut">Sign out</button></div>
       <button class="srow link" data-a="cloudDelAsk"><span class="sl">🗑️ Delete my online data<small>Removes your family's synced data and sign-in. This device keeps its own copy.</small></span><span class="chev">›</span></button>`
    : `<button class="srow link" data-a="cloudIn"><span class="sl">☁️ Sync across devices<small>Sign in with your email to share stars on every device</small></span><span class="chev">›</span></button>`; }
function cloudSheet(step, email, msg){
  layer.innerHTML=`<div class="ov" data-a="closeOv"><div class="sheet" style="max-width:420px">
    <div class="ghead"><h2>☁️ Sync across devices</h2><button class="btn primary sm" data-a="closeOvBtn">Close</button></div>
    ${step===1
      ? `<p>Enter your email. We'll send a 6-number code. Anyone you add later signs in the same way.</p>
         <input id="cloudEmail" class="in tx" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="${esc(email||"")}" style="width:100%;margin:8px 0">
         <button class="btn primary" data-a="cloudSend" style="width:100%">Send my code</button>`
      : `<p>We sent a code to <b>${esc(email)}</b>. It works for 10 minutes.</p>
         <input id="cloudCode" class="in tx" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456" style="width:100%;margin:8px 0;font-size:24px;letter-spacing:6px;text-align:center">
         <button class="btn primary" data-a="cloudVerify" data-e="${esc(email)}" style="width:100%">Sign in</button>
         <button class="btn ghost sm" data-a="cloudIn" data-e="${esc(email)}" style="width:100%;margin-top:8px">Use a different email</button>`}
    <p id="cloudMsg" class="hint" style="text-align:center;min-height:1.4em">${esc(msg||"")}</p>
  </div></div>`;
  const i=layer.querySelector(step===1?"#cloudEmail":"#cloudCode"); if(i) setTimeout(()=>i.focus(),50); }
function cloudDeleteSheet(msg){
  layer.innerHTML=`<div class="ov" data-a="closeOv"><div class="sheet" style="max-width:420px;text-align:center">
    <h2>Delete your online data?</h2>
    <p>This permanently removes your family's synced stars, kids and settings from the cloud, and deletes the sign-in for everyone on this account. Other devices will stop syncing. This device keeps its own copy.</p>
    <div class="row" style="justify-content:center;gap:10px"><button class="btn ghost" data-a="closeOvBtn">Keep it</button><button class="btn primary" data-a="cloudDelYes" style="background:#d33">Delete</button></div>
    <p id="cloudMsg" class="hint" style="min-height:1.4em">${esc(msg||"")}</p></div></div>`; }
async function cloudDelete(){
  const C=window.MomsterCloud, msg=document.getElementById("cloudMsg");
  try{ if(msg) msg.textContent="Deleting…"; let r; let guard=0;
    do{ r=await C.client.mutation(C.api.account.deleteFamily, {}); guard++; }while(r && !r.done && guard<50);
    await C.signOut(); cloudDetach(); Store.remove(CLOUD_LINKED); Store.remove(DIRTY_KEY);
    close(); toast("Your online data was deleted."); render(); }
  catch(err){ if(msg) msg.textContent=String(err.message||err).replace(/^Uncaught Error: /,"").slice(0,160); } }
async function cloudSend(){
  const C=window.MomsterCloud, email=(document.getElementById("cloudEmail")||{}).value||"", msg=document.getElementById("cloudMsg");
  try{ if(msg) msg.textContent="Sending…"; const e=await C.requestCode(email); cloudSheet(2,e,""); }
  catch(err){ if(msg) msg.textContent=String(err.message||err).replace(/^Uncaught Error: /,"").slice(0,140); } }
async function cloudVerify(email){
  const C=window.MomsterCloud, code=(document.getElementById("cloudCode")||{}).value||"", msg=document.getElementById("cloudMsg");
  try{ if(msg) msg.textContent="Checking…"; await C.verifyCode(email,code); close(); toast("Signed in!"); cloudAttach(); setTimeout(()=>{ if(!layer.innerHTML) panel(); },500); }
  catch(err){ if(msg) msg.textContent=String(err.message||err).replace(/^Uncaught Error: /,"").slice(0,140); } }
setInterval(()=>{ const w=weekStart(); if(w!==WEEK){ WEEK=w; Object.keys(KIDS).forEach(k=>{ prevWeeks[k]=weeks[k]; weeks[k]=normWeek(loadLocal("w_"+WEEK+"_"+k)); }); team={given:false}; subscribe(); render(); } }, 60000);

/* ---------- Helpers ---------- */
const rawAv = k => (settings.avatars||{})[k] || KIDS[k].av;
const avHtml = a => PIC[a] ? `<img src="${PIC[a]}" alt="" style="height:1em;width:1em;vertical-align:-0.14em">` : a;

function starsFor(k,w,wk){ let n=w.bonus||0;

const earnedCoins = k => { const b=buddies[k]||{}; return Object.values(b.coinAwards||{}).reduce((a,x)=>a+x,0) + (b.adjCoins||0) + (b.bonusCoins||0); };

  const r=ROUTINES.find(x=>x.id===cat); if(!r) return false; const js=jobsFor(r, dowOfDay(day), k); return js.length>0 && js.every(j=>done.includes(j.id)); }

function reconcileCoins(k){ const b=buddies[k]; if(!b||!b.coinAwards) return; let changed=false;
  Object.keys(b.coinAwards).forEach(key=>{ const m=/^cat:(\d{4}-\d\d-\d\d):(\w+)$/.exec(key); if(!m) return;

/* One celebration at a time: the damage card, cheer banners, combo, sticker, level-up, egg and victory dance wait for their turn
   instead of piling up on top of each other. popup(show, ms, gate): show() runs when it is this one's turn; the next one starts
   ms later, or (with gate) once gate() stops being true (a card or sheet that stays until it is closed). */
const popQ=[]; let popBusy=false;
function popup(show, ms, gate, extra){ popQ.push(Object.assign({show,ms,gate},extra||{})); if(!popBusy) popNext(); }
function popNext(){ const it=popQ.shift(); if(!it){ popBusy=false; return; } popBusy=true;
  try{ it.show(it); }catch(e){ console.warn(e); }
  const next=()=>setTimeout(popNext,250);
  if(it.gate){ const t0=Date.now(), iv=setInterval(()=>{ let on=false; try{ on=it.gate(); }catch(e){} if(!on||Date.now()-t0>90000){ clearInterval(iv); next(); } },300); }
  else setTimeout(next, it.ms||2400); }
// cheer(big, text, keys?, confetti?): the banner, its confetti and its sound all arrive together, when it is its turn.
// It stays until it is tapped, and the next celebration waits for that (pass auto=true for a short banner that goes by itself).
function cheer(big,text,keys,confetti,auto){ let c=null; popup(()=>{ if(confetti) party(confetti);
  c=document.createElement("div"); c.className="cheer"+(auto?"":" tapcard"); c.innerHTML='<div class="big"></div><div></div>'+(auto?"":'<div class="tapnote">Tap to continue</div>');
  c.firstChild.textContent=big; c.children[1].textContent=text; document.body.appendChild(c);
  if(auto) setTimeout(()=>c.remove(),2400); else c.addEventListener("click",()=>c.remove());
  if(keys) play(keys); }, 2400, auto ? null : ()=>!!(c && c.isConnected)); }

const TM_KEY = "starjobs_testmode";
function tmKeys(){ return Store.keys(/^starjobs_/); }
function tmSnapshotAll(){
  const snap = {};

}
function tmEnter(){
  tmSnapshot = tmSnapshotAll();

    FAMILY.kids = [{id:"k1", name:"Lily", av:"🦄", color:"#E2468A"},{id:"k2", name:"Logan", av:"🦖", color:"#1A9C74"}];

function tmExit(){
  testMode = false;
  if(tmSnapshot){
    // wipe everything, then restore the snapshot exactly
    tmKeys().forEach(k=>Store.remove(k));

    tmSnapshot=null;

  document.body.classList.remove("tm");

  if(w.pet2){ if(!w.pet) w.pet=w.pet2; delete w.pet2; }     // one pet
  if(!w.hold && w.hold2){ w.hold=w.hold2; delete w.hold2; }
  if(w.pet && w.hold && w.hold2){ w.hold=w.hold2; delete w.hold2; }   // a pet uses a hand: drop the older toy

// Put a toy or pet into the two hands, dropping the older item when the hands are full.
function equipHands(b, w, slot, id){

  if(slot==="pet"){ w.pet=id; if(w.hold && w.hold2) delete w[older()]; return; }

  else if(w.pet && !w.hold2){ w.hold=id; b.lastHand="hold"; }        // toy + pet: the new toy replaces the toy

function blobToRec(blob){ return new Promise((res,rej)=>{ if(blob.size>190000) return rej(new Error("big"));

  const rows=listDraft.map((j,i)=>`<div class="srow stack"><div class="tpgrid" style="grid-template-columns:64px minmax(0,1fr) auto">
      <input class="in em" data-li="${i}" data-f="e" value="${esc(j.e||"")}" maxlength="8" aria-label="Picture">
      <input class="in tx" data-li="${i}" data-f="t" value="${esc(j.t||"")}" maxlength="40" aria-label="Name">
      <button class="btn ghost sm" data-a="listDel" data-i="${i}" aria-label="Remove">🗑</button></div>
      ${withDays?`<div class="dchips">${[...DAYS].map((d,n)=>`<button class="dc ${!j.days||j.days.includes(n)?"on":""}" data-a="listDay" data-i="${i}" data-d="${n}">${d}</button>`).join("")}</div>`:""}
      ${(withDays&&FAMILY.kids.length>1)?`<div class="dchips whorow"><span class="wholab">For:</span>${FAMILY.kids.map(c=>`<button class="dc wc ${whoList(j).includes(c.id)?"on":""}" aria-pressed="${whoList(j).includes(c.id)}" data-a="listWho" data-i="${i}" data-k="${c.id}" style="--kc:${c.color}">${esc(c.name)}</button>`).join("")}<button class="dc ${!whoList(j).length?"on":""}" aria-pressed="${!whoList(j).length}" data-a="listWho" data-i="${i}" data-k="">Everyone</button></div>`:""}</div>`).join("");
  paintSheet("listSheet",listSec,`<div class="ov"><div class="sheet gsheet" id="listSheet">
    <div class="ghead"><h2>${SEC[listSec][0]}</h2><button class="btn" data-a="famOpen">Back</button></div>
    <p class="hint">${note}</p><div class="grp">${rows||'<div class="srow"><span class="sl"><small>None yet.</small></span></div>'}</div>
    ${listSec==="pk"? (()=>{ const plan=(famPlanDraft)||{}; const list=pickList();
      const days=[...Array(7)].map((_,n)=>{ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); });
      return `<div class="grp-t">📅 Plan ahead (optional)</div><p class="hint">Tap a day to pick that day's special mission for everyone. Kids can still choose on days left as Surprise.</p><div class="grp" style="padding:6px">${days.map((dy,n)=>{ const dd=new Date(dy+"T12:00:00"); const cur=plan[dy]; const mi=cur? list.findIndex(x=>x.id===cur) : -1;
        return `<button class="srow link" data-a="planCycle" data-dy="${dy}" style="width:100%"><span class="sl"><b>${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dd.getDay()]} ${dy.slice(5)}</b><small>${cur? (list.find(x=>x.id===cur)? list.find(x=>x.id===cur).e+" "+list.find(x=>x.id===cur).t : "Surprise") : "🎲 Surprise (kid picks)"}</small></span><span class="chev">${n===0?"today":""}</span></button>`; }).join("")}</div>`; })() :""}
    <div class="sact" style="margin-top:10px;justify-content:space-between"><button class="btn" data-a="listAdd">+ Add</button><button class="btn ghost sm" data-a="listReset">Reset to starter list</button></div>
    <div class="sact" style="margin-top:14px"><small class="saved"></small><button class="btn primary" data-a="listSave">Save</button></div></div></div>`);
  const _sc2 = document.getElementById("listSheet"); if(_sc2 && _sy) _sc2.scrollTop = _sy;
}
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-a]"); if(!t) return; const a=t.dataset.a, i=+t.dataset.i;
  switch(a){
    case "famOpen": famDraft=null; famSheet(false); break;
    case "famColor": famRead(); famDraft[i].color=t.dataset.c; famSheet(!FAMILY_SET); break;
    case "famAdd": famRead(); { const used=famDraft.map(c=>c.color); famDraft.push({id:"k"+Date.now().toString(36), name:"", av:["🐱","🐶","🦊","🐼","🦁","🐸"][famDraft.length%6], color:KID_COLORS.find(c=>!used.includes(c))||KID_COLORS[0]}); } famSheet(!FAMILY_SET); break;
    case "famDel": famRead(); famDraft.splice(i,1); famSheet(!FAMILY_SET); break;
    case "famSave": famRead(); { const firstRun=!FAMILY_SET; const kids=famDraft.map(c=>({id:c.id, name:(c.name||"").trim(), av:(c.av||"").trim()||"⭐", color:c.color})).filter(c=>c.name);
      if(!kids.length){ const n=document.getElementById("famNote"); if(n){ n.style.color="#E5484D"; n.textContent="Add at least one name"; } break; }
      FAMILY.kids=kids; saveFamily(); applyKids(); FAMILY_SET=true; famDraft=null; view.kid=null; close(); render(); play(["fanfare"]); if(firstRun){ pinMode="first"; pinSheet(); } } break;
    case "cloudIn": cloudSheet(1, t.dataset.e||(window.MomsterCloud&&window.MomsterCloud.email)||""); break;
    case "cloudSend": cloudSend(); break;
    case "cloudVerify": cloudVerify(t.dataset.e); break;
    case "cloudDelAsk": cloudDeleteSheet(); break;
    case "cloudDelYes": cloudDelete(); break;
    case "cloudOut": window.MomsterCloud.signOut().then(()=>{ cloudDetach(); panel(); toast("Signed out. This device keeps its own copy."); }); break;
    case "pwaInstall": { const d=window._deferredInstall; if(d){ d.prompt(); try{ saveLocal("installedHint","1"); }catch(e){} window._deferredInstall=null; } panel(); play(["fanfare"]); break; }
    case "fadeChart": famDraft=null; famSheet(false); setTimeout(()=>{ const b=[...document.querySelectorAll('[data-a="listOpen"]')].find(x=>x.textContent.includes("Morning")); if(b){ b.click(); } },350); play(["pop"]); break;
    case "listOpen": listSec=t.dataset.s; listDraft=curList(listSec); if(listSec==="pk") famPlanDraft=Object.assign({}, (FAMILY.pickPlan)||{}); listSheet(); break;
    case "planCycle": { const list=pickList(); const dy=t.dataset.dy; const ids=[null].concat(list.map(x=>x.id)); const cur=(famPlanDraft||{})[dy]; const ci=cur? ids.indexOf(cur) : 0; const next=ids[(ci+1)%ids.length];
        if(!famPlanDraft) famPlanDraft={}; if(next) famPlanDraft[dy]=next; else delete famPlanDraft[dy]; listSheet(); play(["pop"]); break; }
    case "listAdd": listRead(); listDraft.push({id:(listSec==="hp"?"h_":(listSec==="prizes"?"p_":(listSec==="pk"?"p_":"j_")))+Date.now().toString(36), e:"⭐", t:"", days:null}); listSheet();
      setTimeout(()=>{ const ins=document.querySelectorAll('#listSheet .in.tx'); const last=ins[ins.length-1]; if(last){ last.focus(); last.scrollIntoView({block:"center"}); } },50); break;
    case "listDel": listRead(); listDraft.splice(i,1); listSheet(); break;
    case "listReset": listDraft=starterList(listSec); listSheet(); break;
    case "listDay": listRead(); { const j=listDraft[i], d=+t.dataset.d; let ds=j.days?j.days.slice():[0,1,2,3,4,5,6]; ds = ds.includes(d)? ds.filter(x=>x!==d) : ds.concat(d).sort(); j.days = ds.length===7?null:ds; } listSheet(); break;
    case "listWho": listRead(); { const j=listDraft[i]; j.who = t.dataset.k ? normWho(toggleWho(whoList(j), t.dataset.k)) : ""; } listSheet(); break;
    case "listSave": listRead(); { const clean=listDraft.map(j=>Object.assign({id:j.id, e:(j.e||"").trim()||"⭐", t:(j.t||"").trim()}, j.days?{days:j.days}:{}, j.who?{who:j.who}:{})).filter(j=>j.t);
      if(listSec==="prizes"){ FAMILY.prizes=clean; } else if(listSec==="hp") FAMILY.helper=clean; else if(listSec==="pk"){ FAMILY.picks=clean; FAMILY.pickPlan=famPlanDraft||{}; if(!FAMILY.pickPlan||!Object.keys(FAMILY.pickPlan).length) delete FAMILY.pickPlan; } else { FAMILY.jobs=Object.assign({},FAMILY.jobs||{},{[listSec]:clean}); }
      saveFamily(); applyJobs(); famDraft=null; famSheet(false); render(); { const n=document.getElementById("famNote"); if(n) n.textContent = clean.length ? "✓ "+SEC[listSec][0].replace(/^\S+\s/,"")+" saved" : (listSec==="prizes" ? "✓ Prizes are now a surprise — kids just see the jar fill up" : "✓ Saved (empty list)"); } } break;
  }
});
window.MB_DEBUG = {TWISTS, MONSTERS, TAUNTS, VJOKES, JOKES, N_LINES, MOODS, KO_LINES, KO_QUOTE};

/* ---------- Wizard events ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-a]"); if(!t) return; const a=t.dataset.a, i=+t.dataset.i;
  if(a==="wizBack"){ if(wiz && wiz.step>0){ wizReadInputs(); wiz.step--; wizSheet(); } return; }
  if(a==="wizNext"){ wizAdvance(); return; }
  if(a==="wizAddKid"){ wizReadInputs(); { const used=wiz.kids.map(c=>c.color); wiz.kids.push({id:"k"+Date.now().toString(36), name:"", av:["🐱","🐶","🦊","🐼","🦁","🐸"][wiz.kids.length%6], color:KID_COLORS.find(c=>!used.includes(c))||KID_COLORS[0]}); } wizSheet(); return; }
  if(a==="wizDelKid"){ wizReadInputs(); wiz.kids.splice(i,1); wizSheet(); return; }
  if(a==="wizColor"){ wizReadInputs(); wiz.kids[i].color=t.dataset.c; wizSheet(); return; }
  if(a==="wizJob"){ { const sec=t.dataset.s, id=t.dataset.id, arr=wiz.jobs[sec]||[];
      const at=arr.indexOf(id); if(at>=0) arr.splice(at,1); else arr.push(id); wiz.jobs[sec]=arr; } wizSheet(); return; }
  if(a==="wizWho"){ wiz.who = wiz.who||{}; const key=t.dataset.s+"_"+t.dataset.id;
      if(t.dataset.k){ const next=normWho(toggleWho(whoList({who:wiz.who[key]}), t.dataset.k)); if(next.length) wiz.who[key]=next; else delete wiz.who[key]; }
      else delete wiz.who[key];                       // Everyone clears the kids
      wizSheet(); return; }
  if(a==="wizPrize"){ if(!wiz.prizes) wiz.prizes=STARTER_REWARDS.map(p=>p.id); const at=wiz.prizes.indexOf(t.dataset.id); if(at>=0){ wiz.prizes.splice(at,1); } else { wiz.prizes.push(t.dataset.id); } wizSheet(); return; }
  if(a==="wizPrizeMode"){ if(t.dataset.v!==wiz.prizeMode) wiz.prizes=null; wiz.prizeMode=t.dataset.v; wizSheet(); return; }
  if(a==="wizRead"){ wiz.voice = t.dataset.v==="readers" ? true : false; wizSheet(); return; }
  if(a==="wizSound"){ wiz.sound=t.dataset.v; wizSheet(); if(wiz.sound!=="off") play(["ding"]); return; }
  if(a==="wizRace"){ wizReadInputs(); wiz.raceOn=!wiz.raceOn; wizSheet(); return; }
  if(a==="wizRide"){ wizReadInputs(); wiz.rideMode=t.dataset.v; wizSheet(); return; }
  if(a==="wizMission"){ wiz.mission=t.dataset.id; wizSheet(); return; }
  if(a==="wizPin"){ { const n=t.dataset.n; if(n==="\u232B") wiz.pin=wiz.pin.slice(0,-1); else if(wiz.pin.length<4) wiz.pin+=n;
      const d=layer.querySelector("#wizDots"); if(d) d.textContent="\u25CF".repeat(wiz.pin.length);
      if(wiz.pin.length===4){ setTimeout(()=>{ if(wiz && WIZ_STEPS[wiz.step]==="pin" && wiz.pin.length===4) wizAdvance(); },150); } } return; }
  if(a==="tmEnter"){ tmEnter(); return; }
  if(a==="tmExit"){ tmExit(); return; }
});
try{ document.documentElement.setAttribute("data-season", new Date().getMonth()===9 ? "spooky" : ""); }catch(e){}
window._deferredInstall=null; window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); window._deferredInstall=e; try{ if(!loadLocal("installedHint")) render(); }catch(err){} });
render();
if(!FAMILY_SET) wizStart();
else if(!settings.setupDone && !loadLocal("wizOffered")){ saveLocal("wizOffered",1); }
window.MB_DEBUG = {TWISTS, MONSTERS, TAUNTS, VJOKES, JOKES, N_LINES, MOODS, KO_LINES, KO_QUOTE, wiz: (typeof wiz!=="undefined" ? wiz : null)};
setTimeout(()=>Object.keys(KIDS).forEach(k=>{ if(!buddies[k].stickersInit) checkStickers(k,true); }), 4000);
